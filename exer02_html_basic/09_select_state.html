<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*비활성화 상태*/
         input:disabled{
            background-color: gray;
    }
    /*체크된상태*/
    input:checked{
        accent-color:red;
    }
    /*포커스를 받을생테*/
    input:focus{
        background-color: lightgreen;
    }
    /*사용가능한 상태*/
    input:enabled{
        border: 2px solid blue;
    }
    
    </style>
   
</head>
<body>
    <h2>회원가입</h2>
    <P>
        이름:
        <input type="type" placeholder="이름을 입력하시오">
    </P>
    <p>
        학번:
        <input type="text"value="22222506" disabled>
    </p>
    <p>
        <input type="checkbox">
        개인정보 수집에 동의 합니다.
    </p>
</body>
</html>
